version: '3.8'

services:
  # Ollama - LLM local pour génération de texte
  ollama:
    image: ollama/ollama:latest
    container_name: ia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ia-network
    command: serve

  # API Python avec le modèle IA
  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: ia-python-api
    ports:
      - "8001:8000"
    volumes:
      - ./modele_final:/app/modele_final:ro
    environment:
      - PORT=8000
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ia-network

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ia-backend
    ports:
      - "3002:3001"
    environment:
      - PORT=3001
      - PYTHON_API_URL=http://python-api:8000
      - FRONTEND_URL=http://frontend:3000
    depends_on:
      - python-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ia-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    container_name: ia-frontend
    ports:
      - "1418:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ia-network

networks:
  ia-network:
    driver: bridge

volumes:
  ollama_data:
  modele_data:
